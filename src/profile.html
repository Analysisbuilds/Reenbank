<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>ReenBank profile</title>
  <link rel="shortcut icon" href="/src/Assets/images/favicon.png" type="image/x-icon">
</head>
<body class="bg-[#eef7f2] font-sans text-gray-800 antialiased min-h-screen flex">

  <!-- Sidebar -->
  <aside class="w-64 bg-white border-r border-gray-100 flex flex-col justify-between p-6">
    <div>
      <div class="flex items-center gap-3 mb-10">
        <div class="w-10 h-10 bg-emerald-100 rounded-xl flex items-center justify-center font-bold text-emerald-600 text-xl">
          rb
        </div>
        <span class="font-bold text-xl text-gray-900">Reen Bank</span>
      </div>

      <nav class="space-y-2">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-xl hover:bg-gray-50 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
          <span>Overview</span>
        </a>
        <a href="accounts.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-xl hover:bg-gray-50 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
          <span>Accounts</span>
        </a>
        <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-xl hover:bg-gray-50 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
          <span>Transactions</span>
        </a>
        <a href="profile.html" class="flex items-center gap-3 px-4 py-3 font-semibold text-emerald-600 bg-emerald-50/60 rounded-xl">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          <span>Profile</span>
        </a>
      </nav>
    </div>

    <button class="flex items-center gap-3 px-4 py-3 text-gray-500 hover:text-red-500 transition text-sm font-medium">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
      <span>Logout</span>
    </button>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 p-8 overflow-y-auto">

    <!-- Top Navigation Header -->
    <header class="flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Profile</h1>

      <div class="flex items-center gap-6">
        <div class="text-right">
          <p class="text-xs text-emerald-600 font-medium">Maureen Oguche</p>
          <p class="text-lg font-bold tracking-wider text-gray-800">1234567890</p>
        </div>

        <!-- Search Bar -->
        <div class="relative">
          <svg class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
          <input type="text" placeholder="Search..." class="pl-9 pr-4 py-2 text-sm bg-white border border-gray-200 rounded-xl focus:outline-none w-48"/>
        </div>

        <!-- Notification Bell Dropdown -->
        <div class="relative">
          <button id="notification-btn" type="button" class="p-2 rounded-full bg-white border border-slate-200 text-slate-600 hover:text-slate-900 transition relative cursor-pointer">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.73 21a2 2 0 01-3.46 0" /></svg>
            <span id="notif-badge" class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
          </button>

          <div id="notification-dropdown" class="hidden absolute right-0 mt-2 w-80 bg-[#F0F3F1] rounded-2xl p-4 shadow-xl border border-slate-200/70 z-50 space-y-3">
            <div class="text-xs text-slate-700 space-y-3">
              <div class="pb-2.5 border-b border-slate-200/80 flex items-center justify-between">
                <span>OluwaBen sent <strong class="text-[#34be82]">₦ 10,000</strong> to you</span>
              </div>
              <div class="pb-2.5 border-b border-slate-200/80 flex items-center justify-between">
                <span>You sent <strong class="text-red-500">₦ 10,000</strong> to OluwaBen</span>
              </div>
              <div class="flex items-center justify-between">
                <span>You added <strong class="text-red-500">₦ 5,000</strong> to your Account</span>
              </div>
            </div>
          </div>
        </div>

        <!-- Header Profile Avatar -->
        <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white shadow-sm">
          <img id="header-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=150&q=80" alt="Avatar" class="w-full h-full object-cover"/>
        </div>
      </div>
    </header>

    <!-- Grid Layout -->
    <div class="grid grid-cols-12 gap-8 items-start">
      
      <!-- Profile Details Card (Left - 7 Columns) -->
      <div class="col-span-7 bg-white rounded-3xl p-8 shadow-sm flex flex-col items-center relative">
        
        <!-- Editable Avatar Container -->
        <div class="relative mb-4 group">
          <div class="w-24 h-24 rounded-full overflow-hidden border-2 border-emerald-100 shadow-md">
            <img id="profile-image-display" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="Profile" class="w-full h-full object-cover"/>
          </div>
          <!-- Pencil Edit Icon Overlay -->
          <label for="image-upload-input" class="absolute top-0 right-0 bg-gray-200 hover:bg-emerald-500 hover:text-white text-gray-700 rounded-full p-1.5 shadow cursor-pointer transition">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
          </label>
          <input type="file" id="image-upload-input" accept="image/*" class="hidden" />
        </div>

        <!-- Name & Badge -->
        <h2 class="text-xl font-bold text-gray-900 mb-1">Maureen Oguche</h2>
        <span class="bg-purple-100 text-purple-600 text-[10px] font-semibold px-3 py-1 rounded-full mb-8">Pro User</span>

        <!-- Info Fields -->
        <div class="w-full max-w-sm space-y-6 text-left">
          
          <!-- Email (Static) -->
          <div>
            <label class="block text-xs font-semibold text-emerald-600 mb-1">Email</label>
            <p class="text-sm font-semibold text-gray-800 pb-2 border-b border-gray-100">oguchemaureenm@gmail.com</p>
          </div>

          <!-- Phone Number (Editable) -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-semibold text-emerald-600">Phone Number</label>
              <button id="edit-phone-btn" class="text-xs text-gray-400 hover:text-emerald-600 transition flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                <span>Edit</span>
              </button>
            </div>
            <div id="phone-display-container">
              <p id="phone-value" class="text-sm font-semibold text-gray-800 pb-2 border-b border-gray-100">+234 803 041 1314</p>
            </div>
          </div>

          <!-- Gender (Editable) -->
          <div>
            <div class="flex items-center justify-between mb-1">
              <label class="block text-xs font-semibold text-emerald-600">Gender</label>
              <button id="edit-gender-btn" class="text-xs text-gray-400 hover:text-emerald-600 transition flex items-center gap-1">
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                <span>Edit</span>
              </button>
            </div>
            <div id="gender-display-container">
              <p id="gender-value" class="text-sm font-semibold text-gray-800 pb-2 border-b border-gray-100">Female</p>
            </div>
          </div>

        </div>

        <!-- Reset Password Action -->
        <button class="mt-8 w-full max-w-sm bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition text-sm shadow-md shadow-emerald-200">
          Reset Password
        </button>

      </div>

      <!-- Right Column (5 Columns) -->
      <div class="col-span-5 space-y-6">

        <!-- Main Account Box (Default Masked with *****) -->
        <div class="bg-[#d8f3e5] p-6 rounded-2xl shadow-sm relative flex items-center justify-between">
          <div>
            <span class="text-xs font-semibold text-emerald-800 block mb-1">Main Account</span>
            <p id="main-account-balance" class="text-2xl font-bold text-gray-900 tracking-wider">*****</p>
          </div>
          <button id="toggle-account-eye" class="p-2 text-gray-700 hover:text-gray-900 transition" aria-label="Toggle Balance">
            <!-- Closed Eye Default -->
            <svg id="eye-icon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-10-7-10-7a17.88 17.88 0 013.586-4.586m3.172-2.172A9.97 9.97 0 0112 5c7 0 10 7 10 7a17.86 17.86 0 01-2.43 3.32M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" />
            </svg>
          </button>
        </div>

        <!-- Side Transactions List -->
        <div>
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-bold text-sm text-gray-900">Transactions</h3>
            <a href="#" class="text-emerald-600 hover:text-emerald-700 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" /></svg>
            </a>
          </div>

          <div id="side-transactions-list" class="space-y-2 text-xs">
            <!-- Filled dynamically via JS from localStorage -->
          </div>
        </div>

      </div>

    </div>

  </main>

<script src="profile.js"></script>
</body>
</html>
