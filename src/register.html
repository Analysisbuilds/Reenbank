<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>ReenBank-Register</title>
  <link rel="shortcut icon" href="/src/Assets/images/favicon.png" type="image/x-icon">
</head>
<body class="bg-[#d2f3e8] min-h-screen flex items-center justify-center p-6 lg:p-12 font-sans text-slate-800">     
    <div class="w-full max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-12 gap-12 lg:gap-20 items-center">
      <div class="lg:col-span-6 space-y-8">
        <div class="flex items-center space-x-3">
          <img 
            src="/src/Assets/images/logo.png" 
            alt="Reen Bank Logo" 
            class="w-40 h-10 object-contain"
          />
        </div>
        
        <div class="space-y-4 max-w-lg">
          <span class="text-[#34be82] font-semibold text-lg lg:text-xl tracking-wide block mb-0 mt-2">
            Reen Bank
          </span>
          <h1 class="text-4xl sm:text-4xl lg:text-5xl font-extrabold text-slate-900 leading-[1.15] tracking-tight">
          Experience <br class="hidden sm:inline" />hassle-free banking
        </h1>
          <p class="text-slate-600 leading-relaxed text-sm sm:text-base pt-2 mb-0.5 ">
            Experience simple, secure, and stress-free banking. Say goodbye to long queues and complex procedures and hello to hassle-free banking with Reen Bank.
          </p>
        </div>
        <div class="flex items-center space-x-3 pt-2">
          <!-- Facebook svg -->
          <a href="#" class="w-8 h-8 rounded-full bg-[#34be82] text-white flex items-center justify-center hover:opacity-90 transition-opacity">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M22 12c0-5.52-4.48-10-10-10S2 6.48 2 12c0 4.84 3.44 8.87 8 9.8V15H7.5v-3H10V9.5C10 7.01 11.49 5.6 13.73 5.6c1.07 0 2.19.19 2.19.19v2.41h-1.23c-1.23 0-1.61.77-1.61 1.56V12h2.72l-.43 3h-2.29v6.8c4.56-.93 8-4.96 8-9.8z"/></svg>
          </a>
          <!-- Instagram svg-->
          <a href="#" class="w-8 h-8 rounded-full bg-[#34be82] text-white flex items-center justify-center hover:opacity-90 transition-opacity">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
          </a>
          <!-- Twitter svg -->
          <a href="#" class="w-8 h-8 rounded-full bg-[#34be82] text-white flex items-center justify-center hover:opacity-90 transition-opacity">
            <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M24 4.557c-.883.392-1.832.656-2.828.775 1.017-.609 1.798-1.574 2.165-2.724-.951.564-2.005.974-3.127 1.195-.897-.957-2.178-1.555-3.594-1.555-3.179 0-5.515 2.966-4.797 6.045-4.091-.205-7.719-2.165-10.148-5.144-1.29 2.213-.669 5.108 1.523 6.574-.806-.026-1.566-.247-2.229-.616-.054 2.281 1.581 4.415 3.949 4.89-.693.188-1.452.232-2.224.084.626 1.956 2.444 3.379 4.6 3.419-2.07 1.623-4.678 2.348-7.29 2.04 2.179 1.397 4.768 2.212 7.548 2.212 9.142 0 14.307-7.721 13.995-14.646.962-.695 1.797-1.562 2.457-2.549z"/></svg>
          </a>
        </div>
  
      </div>
  
      <div class="lg:col-span-6 bg-white rounded-xl p-4 sm:p-5 shadow-[0px_0px_40px_#34be82] border border-slate-100 max-w-sm mx-auto w-full">
    <h2 class="text-xl font-bold text-[#34be82] mb-3">
      Register
    </h2>
  
    <form onsubmit="event.preventDefault();" class="space-y-2.5">
      
      <!-- Name Input -->
      <div class="space-y-0.5">
        <label class="block text-[10px] font-semibold text-black tracking-wide">
          Name
        </label>
        <div class="relative flex items-center">
          <input 
            type="text" 
            placeholder="Enter name here" 
            class="w-full px-3 py-1.5 text-xs rounded-md border border-slate-200 focus:outline-none focus:border-[#34be82] focus:ring-1 focus:ring-[#34be82] text-slate-800 placeholder-slate-400 pr-8"
            required
          />
          <!-- User Icon -->
          <svg class="w-3.5 h-3.5 absolute right-2.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </div>
      </div>
  
      <!-- Email Input -->
      <div class="space-y-0.5">
        <label class="block text-[10px] font-semibold text-black  tracking-wide">
          Email
        </label>
        <div class="relative flex items-center">
          <input 
            type="email" 
            placeholder="Enter your Email" 
            class="w-full px-3 py-1.5 text-xs rounded-md border border-slate-200 focus:outline-none focus:border-[#34be82] focus:ring-1 focus:ring-[#34be82] text-slate-800 placeholder-slate-400 pr-8"
            required
          />
          <!-- Email Icon -->
          <svg class="w-3.5 h-3.5 absolute right-2.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
      </div>
  
      <!-- Password Input -->
      <div class="space-y-0.5">
        <label class="block text-[10px] font-semibold text-black  tracking-wide">
          Password
        </label>
        <div class="relative flex items-center">
          <input 
            type="password" 
            placeholder="Enter your Password" 
            class="w-full px-3 py-1.5 text-xs rounded-md border border-slate-200 focus:outline-none focus:border-[#34be82] focus:ring-1 focus:ring-[#34be82] text-slate-800 placeholder-slate-400 pr-8"
            required
          />
          <!-- Lock Icon -->
          <svg class="w-3.5 h-3.5 absolute right-2.5 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
          </svg>
        </div>
      </div>
  
      <!-- Checkbox Terms & Conditions -->
      <div class="flex items-center space-x-1.5 pt-0.5">
        <input 
          type="checkbox" 
          id="terms" 
          class="w-3 h-3 text-[#34be82] border-slate-300 rounded focus:ring-[#34be82]"
          required
        />
        <label for="terms" class="text-[10px] text-slate-600 leading-tight">
          I agree to the <a href="#" class="text-[#34be82] hover:underline font-medium">Terms</a>, <a href="#" class="text-[#34be82] hover:underline font-medium">Privacy Policy</a> &amp; <a href="#" class="text-[#34be82] hover:underline font-medium">Fees</a>.
        </label>
      </div>
  
      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-2 bg-[#34be82] hover:bg-[#2ca872] text-white font-bold text-xs rounded-md transition-colors duration-200 shadow-sm"
      >
        Register
      </button>
  
      <!-- Login Redirect Link -->
      <p class="text-[10px] text-slate-500 text-left pt-0.5">
        Already have an Account? <a href="#" class="text-[#34be82] font-semibold hover:underline">Log in</a>
      </p>
  
    </form>
  </div>
  </div>

</body>
