<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="./output.css" rel="stylesheet">
  <title>Transactions</title>
  <link rel="shortcut icon" href="/src/Assets/images/favicon.png" type="image/x-icon">
  <style>
    .active-account-border {
      border-left: 4px solid #6b21a8;
    }
  </style>
</head>
<body class="bg-[#eef7f2] font-sans text-gray-800 antialiased min-h-screen flex flex-col lg:flex-row">

  <div class="lg:hidden sticky top-0 z-40 flex items-center justify-between bg-white border-b border-gray-100 px-4 py-3">
    <img src="Assets/images/logo.png" alt="Reen Bank Logo" class="w-24 h-8 object-contain" />
    <div class="flex items-center gap-3">
      <div class="relative">
        <button
          id="notification-btn-mobile"
          type="button"
          class="p-2 rounded-full bg-[#eef7f2] border border-slate-200/80 text-slate-600 hover:text-slate-900 transition-colors relative cursor-pointer"
          aria-label="Notifications"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.73 21a2 2 0 01-3.46 0" />
          </svg>
          <span id="notif-badge-mobile" class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
        </button>
        <div
          id="notification-dropdown-mobile"
          class="hidden absolute right-0 mt-2 w-64 bg-[#F0F3F1] rounded-2xl p-4 shadow-xl border border-slate-200/70 z-50 space-y-3"
        >
          <div class="text-xs text-slate-700 space-y-3"></div>
        </div>
      </div>
      <a href="profile.html" class="w-9 h-9 rounded-full bg-amber-200 overflow-hidden border-2 border-white shadow-sm block">
        <img src="Assets/images/WhatsApp Image 2026-09-24 at 3.09.05 PM.jpeg" alt="Profile" class="w-full h-full object-cover"/>
      </a>
    </div>
  </div>

  <nav class="lg:hidden grid grid-cols-2 gap-2 px-4 py-3 bg-white border-b border-gray-100">
    <a href="dashboard.html" class="flex items-center gap-2 px-3 py-2.5 text-xs font-semibold text-gray-500 bg-gray-50 rounded-xl">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
      <span>Overview</span>
    </a>
    <a href="accounts.html" class="flex items-center gap-2 px-3 py-2.5 text-xs font-semibold text-gray-500 bg-gray-50 rounded-xl">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
      <span>Accounts</span>
    </a>
    <a href="transactions.html" class="flex items-center gap-2 px-3 py-2.5 text-xs font-semibold text-emerald-600 bg-emerald-50/60 rounded-xl">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
      <span>Transactions</span>
    </a>
    <a href="profile.html" class="flex items-center gap-2 px-3 py-2.5 text-xs font-semibold text-gray-500 bg-gray-50 rounded-xl">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
      <span>Profile</span>
    </a>
  </nav>

  <!-- Sidebar -->
  <aside class="hidden lg:flex w-64 bg-white border-r border-gray-100 flex-col justify-between p-6">
      <div class=" justify-between lg:justify-start lg:space-x-3 mb-8">
          <div class="mb-5">
             <img src="Assets/images/logo.png" alt="Reen Bank Logo" class="w-30 h-10 object-contain ml-4 mt-3" /> 
          </div>
      <nav class="space-y-2 ">
        <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-xl hover:bg-gray-50 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
          <span>Overview</span>
        </a>
        <a href="accounts.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-xl hover:bg-gray-50 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
          <span>Accounts</span>
        </a>
        <a href="transactions.html" class="flex items-center gap-3 px-4 py-3 font-semibold text-emerald-600 bg-emerald-50/60 rounded-xl">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" /></svg>
          <span>Transactions</span>
        </a>
        <a href="profile.html" class="flex items-center gap-3 px-4 py-3 text-gray-500 rounded-xl hover:bg-gray-50 transition">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
          <span>Profile</span>
        </a>
      </nav>
    </div>

    <!-- Logout  -->
      <div class="hidden lg:block pt-4 mt-auto">
        <button 
        type="button" 
        onclick="document.getElementById('logout-modal').classList.remove('hidden');"
        class="w-full flex items-center space-x-3 px-4 py-3 rounded-xl text-sm font-medium text-slate-500 hover:text-red-500 transition-colors cursor-pointer text-left">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12" stroke-width="2" stroke-linecap="round"/>
          <polyline points="12 19 5 12 12 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </aside>

  <!-- logout pop up -->
    <div 
      id="logout-modal" 
      onclick="if(event.target === this) this.classList.add('hidden');"
      class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs hidden items-center justify-center p-4 z-60 flex"
      >
      <div class="bg-white shadow-[0px_0px_40px_#34be82] rounded-3xl p-8 max-w-sm w-full ">
        
        <p class="text-slate-600 text-sm font-medium text-center mb-8">
          Are you sure you want to Logout?
        </p>

        <div class="flex items-center justify-center space-x-4">
          <button 
            type="button" 
            onclick="document.getElementById('logout-modal').classList.add('hidden');" 
            class="w-1/2 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold text-xs rounded-lg transition-colors cursor-pointer"
          >
            Cancel
          </button>
      
          <a 
            href="login.html" 
            class="w-1/2 py-2.5 bg-[#34be82] hover:bg-[#2ca872] text-white font-bold text-xs rounded-lg text-center transition-colors shadow-sm cursor-pointer block"
          >
            Logout
          </a>
        </div>
    
      </div>
    </div>

  <!-- Main Area -->
  <main class="flex-1 p-4 lg:p-8 overflow-y-auto relative">

    <!-- Header -->
    <header class="hidden lg:flex items-center justify-between mb-8">
      <h1 class="text-2xl font-bold text-gray-900">Transactions</h1>

      <div class="text-center">
        <p class="text-xs text-emerald-600 font-medium">Akanmu Qodri</p>
        <p class="text-lg font-bold tracking-wider text-gray-800">1234567890</p>
      </div>

      <div class="flex items-center gap-6">
        <!-- Search -->
        <div class="relative flex items-center">
          <svg class="w-4 h-4 absolute left-3 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <circle cx="11" cy="11" r="8" stroke-width="2" />
            <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2" stroke-linecap="round" />
          </svg>
          <input 
            type="text" 
            placeholder="Search" 
            class="txn-search pl-9 pr-4 py-2 bg-white/80 border border-slate-200/80 rounded-full text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-[#34be82] w-40 sm:w-52"
          />
        </div>

        <div class="relative">
          <button 
            id="notification-btn" 
            type="button"
            class="p-2 rounded-full bg-white border border-slate-200/80 text-slate-600 hover:text-slate-900 transition-colors relative cursor-pointer"
            aria-label="Notifications"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.73 21a2 2 0 01-3.46 0" />
            </svg>
            <span id="notif-badge" class="absolute top-1.5 right-1.5 w-1.5 h-1.5 bg-red-500 rounded-full"></span>
          </button>

          <div 
            id="notification-dropdown" 
            class="hidden absolute right-0 mt-2 w-72 sm:w-80 bg-[#F0F3F1] rounded-2xl p-4 shadow-xl border border-slate-200/70 z-50 space-y-3"
          >
            <div class="text-xs text-slate-700 space-y-3"></div>
          </div>
        </div>

        <a href="profile.html" class="w-10 h-10 rounded-full bg-amber-200 overflow-hidden border-2 border-white shadow-sm block">
          <img src="Assets/images/WhatsApp Image 2026-09-24 at 3.09.05 PM.jpeg" alt="Profile" class="w-full h-full object-cover"/>
        </a>
      </div>
    </header>

    <!-- Account (mobile) -->
    <div class="lg:hidden flex items-center justify-between bg-white rounded-2xl p-4 shadow-sm mb-4">
      <div>
        <p class="text-[11px] text-gray-400 font-semibold uppercase tracking-wide mb-1">Account</p>
        <p class="text-sm font-bold text-emerald-600">Akanmu Qodri</p>
        <p class="text-xs  text-gray-900 font-medium tracking-wider">1234567890</p>
      </div>
      <button
        type="button"
        onclick="document.getElementById('logout-modal').classList.remove('hidden');"
        class="flex items-center gap-2 px-3 py-2 rounded-xl text-xs font-semibold text-slate-500 hover:text-red-500 hover:bg-red-50 transition-colors cursor-pointer"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <line x1="19" y1="12" x2="5" y2="12" stroke-width="2" stroke-linecap="round"/>
          <polyline points="12 19 5 12 12 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Logout</span>
      </button>
    </div>

    <!-- Search (mobile) -->
    <div class="lg:hidden relative flex items-center mb-4">
      <svg class="w-4 h-4 absolute left-3 text-slate-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" stroke-width="2" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2" stroke-linecap="round" />
      </svg>
      <input 
        type="text" 
        placeholder="Search" 
        class="txn-search w-full pl-9 pr-4 py-2 bg-white/80 border border-slate-200/80 rounded-full text-xs text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-1 focus:ring-[#34be82]"
      />
    </div>

    <!-- Accounts Grid -->
    <div class="grid grid-cols-2 gap-3 lg:grid-cols-3 lg:gap-8 mb-10" id="txn-accounts-grid">

      <div class="txn-account-card active-account-border bg-[#d8f3e5] p-4 lg:p-5 rounded-2xl relative transition cursor-pointer shadow-sm" data-account="Main Account">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-[#46237A]">Main Account</span>
          <button class="toggle-eye-btn p-1 text-gray-600 hover:text-gray-900 transition" aria-label="Toggle Balance Visibility">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-10-7-10-7a17.88 17.88 0 013.586-4.586m3.172-2.172A9.97 9.97 0 0112 5c7 0 10 7 10 7a17.86 17.86 0 01-2.43 3.32M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" /></svg>
          </button>
        </div>
        <p class="account-balance text-base lg:text-xl font-bold text-gray-900">*****</p>
      </div>

      <div class="txn-account-card bg-[#d8f3e5] p-4 lg:p-5 rounded-2xl relative transition cursor-pointer shadow-sm" data-account="Savings">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-[#46237A]">Savings</span>
          <button class="toggle-eye-btn p-1 text-gray-600 hover:text-gray-900 transition" aria-label="Toggle Balance Visibility">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-10-7-10-7a17.88 17.88 0 013.586-4.586m3.172-2.172A9.97 9.97 0 0112 5c7 0 10 7 10 7a17.86 17.86 0 01-2.43 3.32M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" /></svg>
          </button>
        </div>
        <p class="account-balance text-base lg:text-xl font-bold text-gray-900">*****</p>
      </div>

      <div class="txn-account-card bg-[#d8f3e5] p-4 lg:p-5 rounded-2xl relative transition cursor-pointer shadow-sm" data-account="Plan">
        <div class="flex items-center justify-between mb-3">
          <span class="text-xs font-semibold text-[#46237A]">Plan</span>
          <button class="toggle-eye-btn p-1 text-gray-600 hover:text-gray-900 transition" aria-label="Toggle Balance Visibility">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-7 0-10-7-10-7a17.88 17.88 0 013.586-4.586m3.172-2.172A9.97 9.97 0 0112 5c7 0 10 7 10 7a17.86 17.86 0 01-2.43 3.32M15 12a3 3 0 11-6 0 3 3 0 016 0z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3l18 18" /></svg>
          </button>
        </div>
        <p class="account-balance text-base lg:text-xl font-bold text-gray-900">*****</p>
      </div>

    </div>

    <!--  Transactions  -->
    <div class="bg-white/60 backdrop-blur-sm rounded-2xl p-4 space-y-1" id="txn-page-list"></div>

  </main>

  <script src="store.js"></script>
  <script src="dashboard.js"></script>
</body>
</html>
